<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 922" width="1400" height="922"><defs><marker id="arr-1a73e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#1a73e8"/></marker><marker id="arr-F29900" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#F29900"/></marker><marker id="arr-3c4043" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#3c4043"/></marker></defs><rect width="1400" height="922" fill="#ffffff"/><text x="34" y="44" font-size="24" font-weight="800" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Design WhatsApp / Telegram</text><text x="34" y="66" font-size="13.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1:1 text messaging · NoSQL store · asynchronous message distributor</text><rect x="50" y="120" width="1300" height="170" rx="10" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/><text x="64" y="140" font-size="12.5" font-weight="700" fill="#1a73e8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">SEND PATH  ·  synchronous</text><rect x="50" y="320" width="1300" height="170" rx="10" fill="#ffffff" stroke="#F29900" stroke-width="1.2"/><text x="64" y="340" font-size="12.5" font-weight="700" fill="#F29900" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">DELIVERY PATH  ·  asynchronous (eventual consistency)</text><rect x="102.0" y="168.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="100.0" y="165.0" width="60" height="60" rx="12" fill="#202124"/><circle cx="130" cy="189" r="6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 208 q0 -11 12 -11 q12 0 12 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="240.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Sender app</text><text x="130" y="253.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">iOS · Android</text><rect x="302.0" y="168.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="300.0" y="165.0" width="60" height="60" rx="12" fill="#8E44AD"/><circle cx="330" cy="186" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="319" cy="204" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="341" cy="204" r="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M330 190 v4 M330 194 h-11 v6 M330 194 h11 v6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="240.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Load balancer</text><text x="330" y="253.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">round robin /</text><text x="330" y="265.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">least loaded</text><rect x="502.0" y="168.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="500.0" y="165.0" width="60" height="60" rx="12" fill="#4285F4"/><path d="M520 187 l9 8 l-9 8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M532 204 h9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="240.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">API servers</text><text x="530" y="253.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">~100 · auto-scaled</text><text x="530" y="265.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">stateless</text><rect x="702.0" y="168.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="700.0" y="165.0" width="60" height="60" rx="12" fill="#8E44AD"/><rect x="720" y="182" width="20" height="26" rx="2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M725 189 h10 M725 195 h10 M725 201 h6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="240.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Hash ring</text><text x="730" y="253.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">user id → partition</text><rect x="902.0" y="168.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="900.0" y="165.0" width="60" height="60" rx="12" fill="#00897B"/><ellipse cx="930" cy="185" rx="11" ry="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M919 185 v20 q11 6 22 0 v-20 M919 195 q11 6 22 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="930" y="240.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">NoSQL store</text><text x="930" y="253.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">DynamoDB</text><text x="930" y="265.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">messages + users</text><path d="M160.0 195.0 L300.0 195.0" fill="none" stroke="#1a73e8" stroke-width="2"  marker-end="url(#arr-1a73e8)"/><path d="M360.0 195.0 L500.0 195.0" fill="none" stroke="#1a73e8" stroke-width="2"  marker-end="url(#arr-1a73e8)"/><path d="M560.0 195.0 L700.0 195.0" fill="none" stroke="#1a73e8" stroke-width="2"  marker-end="url(#arr-1a73e8)"/><path d="M760.0 195.0 L900.0 195.0" fill="none" stroke="#1a73e8" stroke-width="2"  marker-end="url(#arr-1a73e8)"/><rect x="102.0" y="368.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="100.0" y="365.0" width="60" height="60" rx="12" fill="#00897B"/><ellipse cx="130" cy="385" rx="11" ry="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M119 385 v20 q11 6 22 0 v-20 M119 395 q11 6 22 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="440.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">NoSQL store</text><text x="130" y="453.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">undelivered messages</text><rect x="302.0" y="368.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="300.0" y="365.0" width="60" height="60" rx="12" fill="#4285F4"/><path d="M333 382 l-11 15 h9 l-3 12 l11 -15 h-9 z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="440.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Message</text><text x="330" y="454.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">distributor</text><text x="330" y="467.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">partitioned workers</text><rect x="502.0" y="368.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="500.0" y="365.0" width="60" height="60" rx="12" fill="#00897B"/><ellipse cx="530" cy="385" rx="11" ry="4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M519 385 v20 q11 6 22 0 v-20 M519 395 q11 6 22 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="440.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">NoSQL store</text><text x="530" y="453.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">recipient unread-id list</text><rect x="702.0" y="368.0" width="60" height="60" rx="12" fill="#000" opacity="0.10"/><rect x="700.0" y="365.0" width="60" height="60" rx="12" fill="#202124"/><circle cx="730" cy="389" r="6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M718 408 q0 -11 12 -11 q12 0 12 11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="440.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Recipient app</text><text x="730" y="453.0" text-anchor="middle" font-size="10.5" fill="#5f6368" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">check → read → mark read</text><path d="M160.0 395.0 L300.0 395.0" fill="none" stroke="#F29900" stroke-width="2"  marker-end="url(#arr-F29900)"/><path d="M360.0 395.0 L500.0 395.0" fill="none" stroke="#F29900" stroke-width="2"  marker-end="url(#arr-F29900)"/><path d="M560.0 395.0 L700.0 395.0" fill="none" stroke="#F29900" stroke-width="2"  marker-end="url(#arr-F29900)"/><rect x="34" y="540" width="1332" height="188" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.4"/><text x="50" y="563" font-size="13" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Flow</text><circle cx="60.0" cy="582.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="586.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1</text><text x="80" y="586" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Sender calls POST /messages/v1 {sender_id, recipient_id, text}; auth token in header</text><circle cx="60.0" cy="604.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="608.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">2</text><text x="80" y="608" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Load balancer spreads requests over stateless API servers</text><circle cx="60.0" cy="626.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="630.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text><text x="80" y="630" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">API server maps the user id to a partition with consistent hashing (built into DynamoDB)</text><circle cx="60.0" cy="648.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="652.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">4</text><text x="80" y="652" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Row written: message_id, sender, recipient, timestamp, status = undelivered. Returns 200 immediately</text><circle cx="60.0" cy="670.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="674.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">5</text><text x="80" y="674" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Distributor loops over messages whose status is undelivered (partitioned across the user space)</text><circle cx="60.0" cy="692.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="696.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">6</text><text x="80" y="696" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">For each one, appends the message id to the recipient&#x27;s unread list and flips status to delivered</text><circle cx="60.0" cy="714.0" r="10.5" fill="#fff" stroke="#3c4043" stroke-width="2"/><text x="60.0" y="718.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">7</text><text x="80" y="718" font-size="12" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Recipient app calls check-messages: a fast key+column query returns unread ids; read-message then fetches the body and moves the id to read</text><text x="34" y="758" text-anchor="start" font-size="13" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Key design decisions</text><text x="34" y="778" text-anchor="start" font-size="12" font-weight="400" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">•  Scale: 10B msgs/day ≈ 100k/s, peak ≈ 500k/s, doubling in a year; ~1 TB/day (100 B/msg)</text><text x="34" y="796" text-anchor="start" font-size="12" font-weight="400" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">•  NoSQL (DynamoDB) over SQL: a petabyte in 3 years does not fit one relational box; eventual consistency is acceptable</text><text x="34" y="814" text-anchor="start" font-size="12" font-weight="400" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">•  Bottleneck: the distributor scanning an ever-growing table; split delivered / undelivered tables and shard the distributors</text><text x="34" y="862" font-size="12" font-weight="700" fill="#202124" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Service categories</text><rect x="34" y="871" width="14" height="14" rx="3" fill="#4285F4"/><text x="56" y="882" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Compute / containers</text><rect x="192" y="871" width="14" height="14" rx="3" fill="#8E44AD"/><text x="214" y="882" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Networking</text><rect x="350" y="871" width="14" height="14" rx="3" fill="#00897B"/><text x="372" y="882" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Data</text><rect x="508" y="871" width="14" height="14" rx="3" fill="#F29900"/><text x="530" y="882" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">AI / ML</text><rect x="34" y="893" width="14" height="14" rx="3" fill="#D93025"/><text x="56" y="904" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Security</text><rect x="192" y="893" width="14" height="14" rx="3" fill="#1E8E3E"/><text x="214" y="904" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Operations</text><rect x="350" y="893" width="14" height="14" rx="3" fill="#5F6368"/><text x="372" y="904" font-size="11.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Developer tooling</text><circle cx="230.0" cy="195.0" r="10.5" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="230.0" y="199.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a73e8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">1</text><text x="230.0" y="177.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">POST /messages/v1</text><circle cx="430.0" cy="195.0" r="10.5" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="430.0" y="199.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a73e8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">2</text><circle cx="630.0" cy="195.0" r="10.5" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="630.0" y="199.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a73e8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">3</text><text x="630.0" y="177.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">partition by id</text><circle cx="830.0" cy="195.0" r="10.5" fill="#fff" stroke="#1a73e8" stroke-width="2"/><text x="830.0" y="199.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a73e8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">4</text><text x="830.0" y="177.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">write</text><circle cx="230.0" cy="395.0" r="10.5" fill="#fff" stroke="#F29900" stroke-width="2"/><text x="230.0" y="399.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F29900" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">5</text><text x="230.0" y="377.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">scan status</text><circle cx="430.0" cy="395.0" r="10.5" fill="#fff" stroke="#F29900" stroke-width="2"/><text x="430.0" y="399.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F29900" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">6</text><text x="430.0" y="377.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">add unread id</text><circle cx="630.0" cy="395.0" r="10.5" fill="#fff" stroke="#F29900" stroke-width="2"/><text x="630.0" y="399.2" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F29900" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">7</text><text x="630.0" y="377.0" text-anchor="middle" font-size="10.5" fill="#3c4043" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" paint-order="stroke" stroke="#fff" stroke-width="4">GET unread ids</text></svg>